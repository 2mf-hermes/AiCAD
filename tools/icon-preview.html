<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>Ai Cad 圖示校對</title>
<style>
  body { margin:0; padding:32px; background:#0f1013; color:#e8ecf2;
         font-family:'Segoe UI','Microsoft JhengHei',sans-serif; }
  h1 { font-size:15px; font-weight:600; letter-spacing:.02em; margin:0 0 24px; }
  .row { display:flex; align-items:flex-end; gap:24px; margin-bottom:32px; }
  .cell { text-align:center; }
  .cell img { display:block; image-rendering:pixelated; margin:0 auto 8px; }
  .cell span { font-size:11px; color:#8a8f99; }
  .light { background:#f6f6f7; padding:24px; border-radius:12px; }
  .light .cell span { color:#6b7078; }
</style>
</head>
<body>
  <h1>深色底（工作列／檔案總管深色主題）</h1>
  <div class="row">
    <div class="cell"><img src="../winres/icon-256.png" width="256" /><span>256</span></div>
    <div class="cell"><img src="../winres/icon-128.png" width="128" /><span>128</span></div>
    <div class="cell"><img src="../winres/icon-64.png" width="64" /><span>64</span></div>
    <div class="cell"><img src="../winres/icon-48.png" width="48" /><span>48</span></div>
    <div class="cell"><img src="../winres/icon-32.png" width="32" /><span>32</span></div>
    <div class="cell"><img src="../winres/icon-24.png" width="24" /><span>24</span></div>
    <div class="cell"><img src="../winres/icon-16.png" width="16" /><span>16</span></div>
  </div>
  <h1>放大檢視小尺寸像素（16 / 24 / 32 各放大 6 倍）</h1>
  <div class="row">
    <div class="cell"><img src="../winres/icon-16.png" width="96" /><span>16 ×6</span></div>
    <div class="cell"><img src="../winres/icon-24.png" width="144" /><span>24 ×6</span></div>
    <div class="cell"><img src="../winres/icon-32.png" width="192" /><span>32 ×6</span></div>
  </div>
  <h1>淺色底（淺色主題檔案總管）</h1>
  <div class="row light">
    <div class="cell"><img src="../winres/icon-48.png" width="48" /><span>48</span></div>
    <div class="cell"><img src="../winres/icon-32.png" width="32" /><span>32</span></div>
    <div class="cell"><img src="../winres/icon-16.png" width="16" /><span>16</span></div>
  </div>
</body>
</html>
